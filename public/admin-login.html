<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 | KC GPT自动充值系统</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        /* 登录页：居中玻璃卡片。业务样式全部作用域在 .login-page 下 */
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            margin: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        .login-page .backdrop {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(760px 460px at 8% -6%, rgba(0, 113, 227, 0.08), transparent 70%),
                radial-gradient(680px 420px at 96% 100%, rgba(148, 163, 184, 0.18), transparent 72%),
                linear-gradient(180deg, #fbfbfd 0%, var(--bg-page) 46%, #f2f2f5 100%);
        }

        .login-page .card {
            width: 100%;
            max-width: 420px;
            padding: clamp(26px, 4vw, 38px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-dialog);
            background: var(--surface-glass-strong);
            box-shadow: var(--shadow-lg);
            animation: cardIn 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .login-page .card {
                background: var(--surface-glass);
                -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
                backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-page .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .login-page .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(160deg, #2489f5, var(--primary));
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.28);
        }

        .login-page .brand-text {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .login-page h1 {
            margin: 0 0 8px;
            font-size: clamp(22px, 3vw, 26px);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .login-page p.lead {
            margin: 0 0 22px;
            color: var(--text-dim);
            font-size: 13.5px;
            line-height: 1.6;
        }

        .login-page label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
        }

        .login-page input {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 11px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-control);
            background: var(--surface-solid);
            color: var(--text-main);
            font: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .login-page input::placeholder {
            color: var(--text-muted);
        }

        .login-page input:hover {
            border-color: var(--border-strong);
        }

        .login-page input:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
        }

        .login-page .password-field {
            position: relative;
        }

        .login-page .password-field input {
            padding-right: 74px;
        }

        .login-page .password-toggle {
            position: absolute;
            top: 8px;
            right: 8px;
            min-height: 30px;
            padding: 0 10px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-secondary);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-page .password-toggle:hover {
            color: var(--primary);
            border-color: rgba(0, 113, 227, 0.32);
        }

        .login-page button.primary,
        .login-page button.secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 46px;
            padding: 0 18px;
            border-radius: var(--radius-control);
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .login-page button.primary {
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #fff;
            box-shadow: 0 1px 2px rgba(0, 113, 227, 0.2);
        }

        .login-page button.primary:hover:not(:disabled) {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.24);
        }

        .login-page button.secondary {
            margin-top: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-secondary);
        }

        .login-page button.secondary:hover:not(:disabled) {
            background: #fff;
            border-color: var(--border-strong);
            color: var(--text-main);
        }

        .login-page button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            box-shadow: none;
        }

        .login-page .message {
            min-height: 20px;
            margin-top: 14px;
            color: var(--error);
            font-size: 13px;
            line-height: 1.5;
        }

        .login-page .message.success {
            color: var(--success);
        }

        .login-page .message:empty {
            display: none;
        }

        .login-page .step {
            display: none;
        }

        .login-page .step.active {
            display: block;
        }

        .login-page .method-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            padding: 4px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            background: rgba(245, 245, 247, 0.8);
        }

        .login-page .method-tab {
            width: auto;
            flex: 1;
            min-height: 34px;
            padding: 0 10px;
            border: 0;
            border-radius: var(--radius-pill);
            background: transparent;
            color: var(--text-dim);
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-page .method-tab.active {
            background: var(--surface-solid);
            color: var(--text-main);
            box-shadow: 0 1px 3px rgba(31, 38, 50, 0.1);
        }

        .login-page .method-single {
            margin-bottom: 16px;
            padding: 9px 12px;
            border: 1px solid rgba(0, 113, 227, 0.18);
            border-radius: var(--radius);
            background: var(--primary-soft);
            color: #0a4d96;
            font-size: 12.5px;
            font-weight: 600;
        }

        .login-page .method-hint {
            margin: -4px 0 14px;
            color: var(--text-dim);
            font-size: 13px;
            line-height: 1.55;
        }

        .login-page .hint {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.55;
        }

        @media (max-width: 420px) {
            .login-page .card {
                padding: 22px 18px;
            }
        }
    </style>
    <meta name="theme-color" content="#faf9f7">
    <script>
        /* 预绘制应用主题，避免暗色模式闪白 */
        (function () {
            try {
                var t = localStorage.getItem('kc.theme');
                var dark = t === 'dark' || (t !== 'light' &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                var c = localStorage.getItem('kc.color');
                if (c && c !== 'coral') document.documentElement.setAttribute('data-color', c);
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="css/orion-auth.css">
    <script src="js/theme.js" defer></script>
</head>

<body class="login-page">
    <div class="backdrop" aria-hidden="true"></div>

    <main class="card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">KC</span>
            <span class="brand-text">KC GPT自动充值系统</span>
        </div>

        <div id="stepLogin" class="step active">
            <h1>后台登录</h1>
            <p class="lead">使用管理员邮箱和密码登录。若已启用二次验证，登录后还需完成一次验证。</p>

            <label for="email">管理员邮箱</label>
            <input id="email" type="email" placeholder="请输入管理员邮箱" autocomplete="username">

            <label for="password">登录密码</label>
            <div class="password-field">
                <input id="password" type="password" placeholder="请输入登录密码" autocomplete="current-password">
                <button id="togglePassword" class="password-toggle" type="button" aria-pressed="false"
                    aria-controls="password">显示</button>
            </div>

            <button id="loginBtn" class="primary" type="button">继续</button>
        </div>

        <div id="step2fa" class="step">
            <h1>二次验证</h1>
            <p id="step2faHint" class="lead">请选择验证方式并输入验证码。</p>
            <div id="methodTabs" class="method-tabs" style="display:none;"></div>
            <div id="methodSingle" class="method-single" style="display:none;"></div>
            <div id="methodHint" class="method-hint"></div>

            <label for="code">验证码</label>
            <input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="6 位验证码"
                autocomplete="one-time-code">

            <button id="sendTgBtn" class="secondary" type="button" style="display:none;">发送 Telegram 验证码</button>
            <button id="verifyBtn" class="primary" type="button">验证并登录</button>
            <button id="backBtn" class="secondary" type="button">返回</button>
        </div>

        <div id="message" class="message" role="alert" aria-live="assertive"></div>
        <div class="hint">登录失败 5 次将锁定 30 分钟。可在后台「系统配置 → 安全设置」切换验证方式。</div>
    </main>

    <script>
        const TOKEN_KEY = 'plus_admin_token';
        const SECONDARY_TOKEN_KEY = 'plus_admin_secondary_token';
        const METHOD_LABELS = {
            totp: 'Google Authenticator',
            telegram: 'Telegram 验证码'
        };
        const METHOD_HINTS = {
            totp: '请打开 Google Authenticator，输入当前 6 位动态码。',
            telegram: '点击下方按钮发送验证码到管理员 Telegram，再输入 6 位数字。'
        };
        const state = { challengeToken: '', methods: [], selectedMethod: '' };
        let adminPanelPath = '/admin';

        async function loadAdminPaths() {
            try {
                const response = await fetch('/api/public/admin-paths');
                const data = await response.json();
                if (data.success) {
                    adminPanelPath = data.panelUrl || `/${data.panelPath || 'admin'}`;
                }
            } catch (_) { }
        }

        function goToAdminPanel() {
            location.href = adminPanelPath;
        }

        function getBrowserFingerprint() {
            const parts = [
                navigator.userAgent,
                navigator.language,
                screen.width,
                screen.height,
                Intl.DateTimeFormat().resolvedOptions().timeZone || ''
            ];
            return btoa(unescape(encodeURIComponent(parts.join('|')))).slice(0, 96);
        }

        function setMessage(text, isSuccess) {
            const el = document.getElementById('message');
            el.textContent = text || '';
            el.className = 'message' + (isSuccess ? ' success' : '');
        }

        function showStep(name) {
            document.querySelectorAll('.step').forEach((el) => el.classList.remove('active'));
            document.getElementById(name === '2fa' ? 'step2fa' : 'stepLogin').classList.add('active');
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const btn = document.getElementById('togglePassword');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.textContent = show ? '隐藏' : '显示';
            btn.setAttribute('aria-pressed', show ? 'true' : 'false');
            input.focus({ preventScroll: true });
        }

        function updateMethodUi() {
            const method = state.selectedMethod;
            const hintEl = document.getElementById('methodHint');
            const sendTgBtn = document.getElementById('sendTgBtn');
            const codeInput = document.getElementById('code');

            hintEl.textContent = METHOD_HINTS[method] || '请输入验证码';
            sendTgBtn.style.display = method === 'telegram' ? 'block' : 'none';
            codeInput.placeholder = method === 'totp' ? 'Google Authenticator 6 位码' : 'Telegram 6 位验证码';
            codeInput.value = '';
            setMessage('');
        }

        function selectMethod(method) {
            if (!state.methods.includes(method)) return;
            state.selectedMethod = method;
            document.querySelectorAll('.method-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.method === method);
            });
            updateMethodUi();
        }

        function renderMethods(methods, defaultMethod) {
            const tabs = document.getElementById('methodTabs');
            const single = document.getElementById('methodSingle');
            tabs.innerHTML = '';
            state.methods = methods || [];
            state.selectedMethod = defaultMethod && methods.includes(defaultMethod)
                ? defaultMethod
                : (methods[0] || '');

            if (methods.length <= 1) {
                tabs.style.display = 'none';
                single.style.display = methods.length ? 'block' : 'none';
                single.textContent = methods.length
                    ? `验证方式：${METHOD_LABELS[methods[0]] || methods[0]}`
                    : '';
            } else {
                tabs.style.display = 'flex';
                single.style.display = 'none';
                methods.forEach((method) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'method-tab' + (method === state.selectedMethod ? ' active' : '');
                    btn.dataset.method = method;
                    btn.textContent = METHOD_LABELS[method] || method;
                    btn.onclick = () => selectMethod(method);
                    tabs.appendChild(btn);
                });
            }
            updateMethodUi();
        }

        async function verifyExistingToken() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) return;
            try {
                const response = await fetch('/api/admin/session', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!response.ok) {
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem(SECONDARY_TOKEN_KEY);
                    return;
                }
                const data = await response.json();
                if (data.refreshed && data.token) {
                    localStorage.setItem(TOKEN_KEY, data.token);
                }
                location.href = adminPanelPath;
            } catch (_) {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(SECONDARY_TOKEN_KEY);
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                setMessage('请输入邮箱和密码');
                return;
            }
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            setMessage('');
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, fingerprint: getBrowserFingerprint() })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    setMessage(data.message || '登录失败');
                    return;
                }
                if (data.requires2fa) {
                    state.challengeToken = data.challengeToken;
                    renderMethods(data.methods || [], data.defaultMethod || '');
                    const modeHint = data.login2faMode === 'either' && (data.methods || []).length > 1
                        ? '可在下方切换 Google Authenticator / Telegram 验证。'
                        : '';
                    document.getElementById('step2faHint').textContent =
                        `账号 ${data.email || email} 需要二次验证。${modeHint}`;
                    showStep('2fa');
                    return;
                }
                if (data.token) {
                    localStorage.setItem(TOKEN_KEY, data.token);
                    localStorage.removeItem(SECONDARY_TOKEN_KEY);
                    adminPanelPath = data.panelPath || adminPanelPath;
                    goToAdminPanel();
                }
            } catch (_) {
                setMessage('登录请求失败');
            } finally {
                loginBtn.disabled = false;
            }
        }

        async function sendTelegramCode() {
            if (state.selectedMethod !== 'telegram') {
                setMessage('请先切换到 Telegram 验证码');
                return;
            }
            const btn = document.getElementById('sendTgBtn');
            btn.disabled = true;
            try {
                const response = await fetch('/api/admin/login/send-tg-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ challengeToken: state.challengeToken })
                });
                const data = await response.json();
                setMessage(data.message || (data.success ? '验证码已发送' : '发送失败'), data.success);
            } catch (_) {
                setMessage('发送失败');
            } finally {
                btn.disabled = false;
            }
        }

        async function verify2fa() {
            const code = document.getElementById('code').value.trim();
            if (!code) {
                setMessage('请输入验证码');
                return;
            }
            if (!state.selectedMethod) {
                setMessage('请选择验证方式');
                return;
            }
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            setMessage('');
            try {
                const response = await fetch('/api/admin/login/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challengeToken: state.challengeToken,
                        method: state.selectedMethod,
                        code,
                        fingerprint: getBrowserFingerprint()
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success || !data.token) {
                    setMessage(data.message || '验证失败');
                    return;
                }
                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.removeItem(SECONDARY_TOKEN_KEY);
                adminPanelPath = data.panelPath || adminPanelPath;
                goToAdminPanel();
            } catch (_) {
                setMessage('验证请求失败');
            } finally {
                verifyBtn.disabled = false;
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('verifyBtn').addEventListener('click', verify2fa);
        document.getElementById('sendTgBtn').addEventListener('click', sendTelegramCode);
        document.getElementById('backBtn').addEventListener('click', () => showStep('login'));
        document.getElementById('togglePassword').addEventListener('click', togglePasswordVisibility);
        document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        document.getElementById('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') verify2fa(); });

        loadAdminPaths().then(() => verifyExistingToken());
    </script>
</body>

</html>
